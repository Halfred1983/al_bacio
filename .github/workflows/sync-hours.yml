name: Sync Opening Hours from Google Maps

on:
  schedule:
    # Run every ~15 days (1st and 16th of each month at 06:00 UTC)
    - cron: '0 6 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-hours:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright-core
          npx playwright-core install chromium --with-deps

      - name: Scrape opening hours from Google Maps
        run: node scripts/sync-hours.mjs

      - name: Commit and push updated hours
        run: |
          if [ -n "$(git status --porcelain src/data/hours.json index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/hours.json index.html
            git commit -m "chore: sync opening hours from Google Maps"
            git push
          else
            echo "Opening hours are already up to date."
          fi
